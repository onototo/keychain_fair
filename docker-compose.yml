services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keychain_fair
      POSTGRES_USER: keychain
      POSTGRES_PASSWORD: keychain
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keychain -d keychain_fair"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: .
    environment:
      DATABASE_URL: postgresql://keychain:keychain@postgres:5432/keychain_fair
      ADMIN_PIN: ${ADMIN_PIN:-1337}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-change-me-internal-token}
      PUBLIC_URL: ${PUBLIC_URL:-http://127.0.0.1:8080}
      SLICER_ENABLED: ${SLICER_ENABLED:-false}
      OCTOPRINT_ENABLED: ${OCTOPRINT_ENABLED:-false}
      OCTOPRINT_BASE_URL: ${OCTOPRINT_BASE_URL:-http://host.docker.internal:5000}
      OCTOPRINT_API_KEY: ${OCTOPRINT_API_KEY:-}
      OPENSCAD_PATH: ${OPENSCAD_PATH:-openscad}
      CURA_ENGINE_PATH: ${CURA_ENGINE_PATH:-CuraEngine}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./designs:/app/designs
      - generated-data:/app/generated

  telegram-bot:
    build:
      context: ./bot
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      API_BASE_URL: http://api:8080
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-change-me-internal-token}
      BOT_DATABASE_URL: postgresql://keychain:keychain@postgres:5432/keychain_fair
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started

volumes:
  postgres-data:
  generated-data:
