services:
  api:
    build:
      context: .
    environment:
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-change-me-internal-token}
      CART_MAX_UNITS: ${CART_MAX_UNITS:-99}
    restart: unless-stopped
    ports:
      - "8120:8120"
    volumes:
      - ./catalog:/app/catalog
      - ./config/europost-offices.json:/app/config/europost-offices.json:ro
      - shop-data:/app/data

  telegram-bot:
    build:
      context: ./bot
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      API_BASE_URL: http://api:8120
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-change-me-internal-token}
      ADMIN_TELEGRAM_USER_IDS: ${ADMIN_TELEGRAM_USER_IDS:-}
      PAYMENT_CARD_NUMBER: ${PAYMENT_CARD_NUMBER:-}
      PAYMENT_CARD_HOLDER: ${PAYMENT_CARD_HOLDER:-}
      ONLINE_PAYMENT_URL: ${ONLINE_PAYMENT_URL:-}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started

volumes:
  shop-data:
