<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>3D предпросмотр заказа</title>
    <link rel="stylesheet" href="/static/styles.css?v=20260717-order-preview" />
    <script type="importmap">
      {
        "imports": {
          "three": "/static/vendor/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <main id="orderPreviewApp" class="shell order-preview-shell">
      <header class="topbar order-preview-topbar">
        <div class="brand">
          <h1 id="orderTitle">3D предпросмотр</h1>
          <span id="orderMeta" class="muted"></span>
        </div>
        <div class="toolbar">
          <a class="button-link secondary" href="/admin">Админка</a>
        </div>
      </header>

      <section class="order-preview-layout">
        <aside class="panel order-preview-summary">
          <div class="panel-head">
            <h2>Заказ</h2>
          </div>
          <div class="panel-body">
            <dl class="order-preview-details">
              <div>
                <dt>Клиент</dt>
                <dd id="summaryCustomer">--</dd>
              </div>
              <div>
                <dt>Авто</dt>
                <dd id="summaryCar">--</dd>
              </div>
              <div>
                <dt>Дизайн</dt>
                <dd id="summaryDesign">--</dd>
              </div>
              <div>
                <dt>Текст</dt>
                <dd id="summaryText">--</dd>
              </div>
              <div>
                <dt>Статус</dt>
                <dd id="summaryStatus">--</dd>
              </div>
            </dl>
          </div>
        </aside>

        <section class="editor-viewer order-preview-viewer panel">
          <canvas id="modelCanvas"></canvas>
          <div id="viewerMessage" class="viewer-message">Генерация STL...</div>
          <div id="dimensionOverlay" class="dimension-overlay"></div>
        </section>
      </section>
    </main>

    <script type="module" src="/static/order-preview.js?v=20260717-order-preview"></script>
  </body>
</html>
