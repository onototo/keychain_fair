<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Брелок на заказ</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand">
          <h1>Брелок на заказ</h1>
          <span>3D-печать на ярмарке</span>
        </div>
        <a href="/admin" class="muted small">Оператор</a>
      </header>

      <section class="grid">
        <form id="orderForm" class="panel">
          <div class="panel-head">
            <h2>Заказ</h2>
            <span id="price" class="pill">0</span>
          </div>
          <div class="panel-body">
            <div class="form-grid">
              <label>
                Имя
                <input
                  name="customer_name"
                  autocomplete="name"
                  required
                  minlength="2"
                  maxlength="30"
                  pattern="[A-Za-zА-Яа-яЁёІіЇїЄєЎўҐґ ]{2,30}"
                  title="Только буквы латиницы/кириллицы, до 30 символов"
                />
              </label>
              <label id="carNumberField">
                Номер авто
                <input
                  name="car_number"
                  minlength="7"
                  maxlength="9"
                  autocapitalize="characters"
                  pattern="[0-9]{4}\s?[ABCEHIKMOPTX]{2}-?[1-7]"
                  title="РБ латиницей: 1234 AB-7"
                />
              </label>
              <label id="printLine1Field" hidden>
                Строка 1
                <input name="print_line_1" maxlength="48" />
                <span id="customTextHelp" class="small muted"></span>
              </label>
              <label id="printLine2Field" hidden>
                Строка 2
                <input name="print_line_2" maxlength="48" />
              </label>
              <label>
                Телефон
                <input
                  name="phone"
                  autocomplete="tel"
                  inputmode="tel"
                  required
                  minlength="11"
                  maxlength="13"
                  pattern="\+?(79[0-9]{9}|89[0-9]{9}|375(25|29|33|44)[0-9]{7})"
                  title="Цифры и необязательный +. РФ: 79XXXXXXXXX или 89XXXXXXXXX, РБ: 37529XXXXXXX"
                />
              </label>
            </div>

            <div>
              <div class="small muted">Дизайн</div>
              <div id="designs" class="design-list"></div>
            </div>

            <label>
              Размер
              <select name="size_id" id="sizeSelect"></select>
            </label>

            <button type="submit">Подтвердить дизайн</button>
          </div>
        </form>

      </section>

      <section class="panel live-preview-panel">
        <div class="panel-head">
          <h2>Макет</h2>
          <span id="designName" class="muted small"></span>
        </div>
        <div class="panel-body">
          <div class="preview-wrap">
            <div id="preview" class="keychain-preview">
              <img id="previewImage" class="preview-image" src="/static/design-previews/fallback.png" alt="" />
            </div>
          </div>
        </div>
      </section>

      <section class="checkout-bar">
        <div>
          <div class="small muted">Проверьте макет перед отправкой</div>
          <div class="checkout-title">Заказ появится у продавца после подтверждения</div>
        </div>
        <div class="checkout-actions">
          <button id="submitOrderButton" class="submit-order" type="submit" form="orderForm">Подтвердить заказ</button>
          <div id="message" class="message"></div>
        </div>
      </section>
    </main>

    <script src="/static/index.js"></script>
  </body>
</html>
