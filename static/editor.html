<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>3D редактор моделей</title>
    <link rel="stylesheet" href="/static/styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "/static/vendor/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <main id="editorLogin" class="login panel">
      <div class="panel-head">
        <h1>3D редактор</h1>
      </div>
      <form id="editorLoginForm" class="panel-body">
        <label>
          PIN
          <input id="editorPinInput" type="password" inputmode="numeric" autocomplete="current-password" />
        </label>
        <button type="submit">Войти</button>
        <div id="editorLoginMessage" class="message"></div>
      </form>
    </main>

    <main id="editorApp" class="shell editor-shell" hidden>
      <header class="topbar editor-topbar">
        <div class="brand">
          <h1>3D редактор</h1>
          <span id="editorStatus" class="muted"></span>
        </div>
        <div class="toolbar">
          <a class="button-link secondary" href="/admin">Админка</a>
          <button id="updatePreview">Обновить 3D</button>
          <button id="savePreset" class="danger">Сохранить пресет</button>
          <button id="resetPreset" class="secondary">Сбросить изменения</button>
          <button id="editorLogout" class="secondary">Выйти</button>
        </div>
      </header>

      <section class="editor-layout">
        <aside class="editor-controls panel">
          <div class="panel-body editor-fields">
            <div class="field-row">
              <label>
                Дизайн
                <select id="designSelect"></select>
              </label>
              <label>
                Размер
                <select id="sizeSelect"></select>
              </label>
            </div>

            <section class="editor-group">
              <h2>Тестовый текст</h2>
              <input id="sampleName" value="Nikita" type="hidden" />
              <label>
                Строка 1
                <input id="sampleCar" value="1234AB7" maxlength="16" />
              </label>
              <label>
                Строка 2
                <input id="sampleLine2" value="" maxlength="48" />
              </label>
            </section>

            <section class="editor-group">
              <h2>Основа</h2>
              <div class="field-row">
                <label>Ширина, мм<input id="baseWidth" type="number" step="0.1" min="20" max="160" /></label>
                <label>Высота, мм<input id="baseHeight" type="number" step="0.1" min="8" max="80" /></label>
              </div>
              <div class="field-row">
                <label class="stepper-label">
                  База Z, мм
                  <span class="stepper">
                    <button type="button" class="stepper-button" data-height-step="thickness_mm" data-step-delta="-1" aria-label="Уменьшить базу Z">-</button>
                    <input id="thickness" type="number" step="0.2" min="1.1" max="5.9" readonly />
                    <button type="button" class="stepper-button" data-height-step="thickness_mm" data-step-delta="1" aria-label="Увеличить базу Z">+</button>
                  </span>
                </label>
                <label class="stepper-label">
                  Рельеф, мм
                  <span class="stepper">
                    <button type="button" class="stepper-button" data-height-step="relief_height_mm" data-step-delta="-1" aria-label="Уменьшить рельеф">-</button>
                    <input id="reliefHeight" type="number" step="0.2" min="0.2" max="2" readonly />
                    <button type="button" class="stepper-button" data-height-step="relief_height_mm" data-step-delta="1" aria-label="Увеличить рельеф">+</button>
                  </span>
                </label>
              </div>
            </section>

            <section class="editor-group">
              <h2>Отверстие / ушко</h2>
              <div class="field-row">
                <label>X, мм<input id="holeX" type="number" step="0.1" /></label>
                <label>Y, мм<input id="holeY" type="number" step="0.1" /></label>
              </div>
              <label>Радиус, мм<input id="holeRadius" type="number" step="0.05" min="1" max="8" /></label>
            </section>

            <section class="editor-group">
              <h2>Текст</h2>
              <div id="blockTabs" class="segmented"></div>
              <div class="field-row">
                <label>Смещение X<input id="blockX" type="number" step="0.1" /></label>
                <label>Смещение Y<input id="blockY" type="number" step="0.1" /></label>
              </div>
              <div class="field-row">
                <label>Область W<input id="blockBoxWidth" type="number" step="0.1" min="0" /></label>
                <label>Область H<input id="blockBoxHeight" type="number" step="0.1" min="0" /></label>
              </div>
              <div class="field-row">
                <label>Шрифт<input id="blockFont" type="number" step="0.1" min="1" max="40" /></label>
                <label>Высота<input id="blockRelief" type="number" step="0.05" min="0.2" max="2" /></label>
              </div>
              <div class="small muted">0 в области текста означает автоматический размер.</div>
            </section>

            <div id="editorMessage" class="message"></div>
          </div>
        </aside>

        <section class="editor-viewer panel">
          <canvas id="modelCanvas"></canvas>
          <div id="viewerMessage" class="viewer-message">Нажмите «Обновить 3D»</div>
          <div id="dimensionOverlay" class="dimension-overlay"></div>
        </section>
      </section>
    </main>

    <script type="module" src="/static/editor.js?v=20260714-two-lines"></script>
  </body>
</html>
